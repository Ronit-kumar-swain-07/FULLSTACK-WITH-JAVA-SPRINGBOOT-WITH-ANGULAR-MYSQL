<div class="container mt-4">

    <!-- HEADER + LOGOUT -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="text-primary">Admin Control Panel</h2>

        <!-- LOGOUT BUTTON -->
        <button class="btn btn-danger"
                (click)="logout()">
            Logout
        </button>

    </div>

    <div class="row g-3">

        <div class="col-md-4">
            <div class="card p-3 bg-success text-white text-center">
                <h4>Doctors</h4>
                <button class="btn btn-light mt-2" routerLink="/doctor-registration">
                    Manage Doctors
                </button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 bg-danger text-white text-center">
                <h4>Patients</h4>
                <button class="btn btn-light mt-2" routerLink="/patient-registration">
                    Manage Patients
                </button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 bg-warning text-dark text-center">
                <h4>Appointments</h4>
                <button class="btn btn-dark mt-2" routerLink="/appointment">
                    View Appointments
                </button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 bg-info text-white text-center">
                <h4>Billing</h4>
                <button class="btn btn-light mt-2" routerLink="/billing">
                    Manage Billing
                </button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 bg-dark text-white text-center">
                <h4>Reports</h4>
                <button class="btn btn-light mt-2" routerLink="/reports">
                    View Reports
                </button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 bg-secondary text-white text-center">
                <h4>Rooms</h4>
                <button class="btn btn-light mt-2" routerLink="/room-allocation">
                    Manage Rooms
                </button>
            </div>
        </div>

    </div>

</div>
