<div class="container">

    <div class="card shadow p-5 mt-4">

        <h2 class="text-center text-success mb-4">
            Appointment Scheduling
        </h2>

        <!-- Success Message -->
        <div *ngIf="message" class="alert alert-success text-center">
            {{message}}
        </div>

        <div class="row">

            <div class="col-md-6">

                <label class="form-label">Patient Name</label>

                <input type="text" class="form-control mb-3" placeholder="Enter Patient Name"
                    [(ngModel)]="appointment.patientName">

            </div>

            <div class="col-md-6">

                <label class="form-label">Doctor Name</label>

                <input type="text" class="form-control mb-3" placeholder="Enter Doctor Name"
                    [(ngModel)]="appointment.doctorName">

            </div>

        </div>

        <div class="row">

            <div class="col-md-6">

                <label class="form-label">Appointment Date</label>

                <input type="date" class="form-control mb-3" [(ngModel)]="appointment.date">

            </div>

            <div class="col-md-6">

                <label class="form-label">Appointment Time</label>

                <input type="time" class="form-control mb-3" [(ngModel)]="appointment.time">

            </div>

        </div>

        <button class="btn btn-success w-100" (click)="bookAppointment()">

            Book Appointment

        </button>

    </div>

</div>
