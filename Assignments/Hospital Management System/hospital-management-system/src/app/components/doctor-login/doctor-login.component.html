<div class="container">

    <div class="card shadow p-5 mt-5 w-50 mx-auto">

        <h2 class="text-center text-success mb-4">
            Doctor Login
        </h2>

        <input type="text"
                class="form-control mb-3"
                placeholder="Enter Doctor ID"
                [(ngModel)]="doctorid">

        <input type="password"
                class="form-control mb-3"
                placeholder="Enter Password"
                [(ngModel)]="password">

        <button class="btn btn-success w-100"
                (click)="login()">
            Login
        </button>

    </div>

</div>
